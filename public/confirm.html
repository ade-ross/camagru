<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your account · Camagru</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/confirm.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main>
    <h1>Confirm your account</h1>

    <!-- Confirming waits for this click instead of happening when the page
         loads: mail scanners open links in emails, some even run JavaScript,
         and must not use up the token (see docs/decisions.md) -->
    <form id="confirm-form" class="form" method="post">
      <p>Click the button to activate your account.</p>
      <button type="submit">Confirm my account</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <p id="done" class="message success" hidden>
      Your account is confirmed. You can now <a href="/login.html">log in</a>.
    </p>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>

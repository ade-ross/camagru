<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Camagru</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/forgot-password.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main>
    <h1>Forgot your password?</h1>

    <form id="forgot-form" class="form" method="post">
      <p>Enter your account's email and we will send you a link to choose a new password.</p>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required maxlength="254">
      </label>
      <button type="submit">Send the link</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <p><a href="/login.html">Back to log in</a></p>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>

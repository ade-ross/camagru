<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Camagru</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main>
    <h1>Log in</h1>

    <!-- method="post": if the JS ever failed to load, a default GET submit
         would put the password in the URL (history, server logs) -->
    <form id="login-form" class="form" method="post">
      <label>
        Username
        <input name="username" type="text" autocomplete="username" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <p><a href="/forgot-password.html">Forgot your password?</a></p>
    <p>No account yet? <a href="/register.html">Sign up</a></p>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>

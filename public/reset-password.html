<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Camagru</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/reset-password.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main>
    <h1>Choose a new password</h1>

    <form id="reset-form" class="form" method="post">
      <label>
        New password
        <input name="password" type="password" autocomplete="new-password" required
               minlength="8" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*\d).{8,128}"
               title="At least 8 characters, with a letter and a digit">
        <span class="hint">At least 8 characters, with a letter and a digit</span>
      </label>
      <button type="submit">Save the new password</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>

    <p id="done" class="message success" hidden>
      Your password was changed and you were logged out everywhere.
      You can now <a href="/login.html">log in</a> with the new password.
    </p>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
